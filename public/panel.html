<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>پنل‌های مدیریت | دکان هات‌داگ نادر</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/app.css">
<style>
  .hub{display:grid;gap:14px;max-width:520px;margin:10px auto}
  .hub a{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:border-color .15s,box-shadow .15s}
  .hub a:hover{border-color:#DDD5CF;box-shadow:var(--shadow)}
  .hub a .e{font-size:1.6rem;width:52px;height:52px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
  .hub a b{font-size:1.15rem;display:block}
  .hub a span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><img src="/img/logo.png" alt="">پنل‌های مدیریت</a></header>
<main class="panel-wrap">
  <div class="hub">
    <a href="/kitchen"><span class="e">👨‍🍳</span><div><b>آشپزخانه</b><span>سفارش‌هایی که باید پخته بشن، چاپ خودکار، دکمه‌ی «آماده شد»</span></div></a>
    <a href="/manager"><span class="e">🧾</span><div><b>مدیر فروشگاه</b><span>سفارش‌های امروز، پرداخت و لغو، خلاصه‌ی فروش امروز، موجودی منو</span></div></a>
    <a href="/owner"><span class="e">👑</span><div><b>مدیر کل</b><span>گزارش فروش، همه‌ی سفارش‌ها و اکسل، منو و قیمت‌ها، کدهای دسترسی</span></div></a>
  </div>
</main>
</body>
</html>
