<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دکان مزه نادر | به‌زودی</title>
<link rel="icon" href="/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--red:#FA3225;--ink:#141010;--ink-2:#4A3C33;--bg:#F8EFDC;--paper:#FFF8EA;--yellow:#FFC93C;--olive:#2F3B2A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;display:flex;flex-direction:column}
  .checker{height:14px;background:repeating-conic-gradient(var(--red) 0 25%,var(--bg) 0 50%) 0 0/14px 14px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .card{background:var(--olive);color:var(--paper);border-radius:28px;padding:40px 28px;max-width:460px;width:100%;text-align:center}
  .mono{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;background:var(--paper);color:var(--olive);display:flex;align-items:center;justify-content:center;font-size:4.2rem;font-weight:900;line-height:1}
  .badge{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:.85rem}
  h1{font-size:2rem;font-weight:900;margin:10px 0 6px}
  p{opacity:.88}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:26px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;font-weight:800;text-decoration:none}
  .btn.main{background:var(--paper);color:var(--olive)}
  .btn.line{color:var(--paper);border:1.5px solid rgba(255,248,234,.5)}
</style>
</head>
<body>
<div class="checker"></div>
<main>
  <div class="card">
    <div class="mono" aria-hidden="true">م</div>
    <span class="badge">به‌زودی</span>
    <h1>دکان مزه نادر</h1>
    <p>داریم دکان مزه رو آماده می‌کنیم. خیلی زود منو و سفارش آنلاین همین‌جا باز میشه.</p>
    <div class="btns">
      <a class="btn main" href="/hotdog">فعلاً یه سر به دکان هات‌داگ بزن</a>
      <a class="btn line" href="/">بازگشت به دکان نادر</a>
    </div>
  </div>
</main>
<div class="checker"></div>
</body>
</html>
