<!doctype html>
<html lang="fa" dir="rtl">
<head>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFC83D;color:#1D1410;font-family:"Vazirmatn",system-ui,sans-serif;text-align:center;padding:24px}

  .dog{font-size:clamp(7rem,28vw,11rem);line-height:1;display:inline-block;transform:rotate(-12deg);filter:drop-shadow(8px 10px 0 rgba(29,20,16,.25));animation:bob 3s ease-in-out infinite}

  h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:900;margin:22px 0 6px}
  .tag{display:inline-block;background:#D7262E;color:#fff;border:2px solid #1D1410;border-radius:999px;padding:6px 22px;font-weight:800;font-size:1.25rem;box-shadow:4px 4px 0 #1D1410;margin:10px 0 22px}

  .en h2{font-size:1.6rem;font-weight:800}
  .ig{display:inline-block;margin-top:24px;background:#fff;color:#1D1410;text-decoration:none;border:2px solid #1D1410;border-radius:999px;padding:8px 20px;font-weight:800;box-shadow:4px 4px 0 #1D1410;direction:ltr}
</style>
</head>
<body>
  <div class="box">
    <div class="dog" aria-hidden="true">🌭</div>

    <div class="en">
      <h2>Nader Dokan · Coming soon!</h2>

    </div>
    <a class="ig" href="https://instagram.com/naderhotdog" target="_blank" rel="noopener">📸 @naderhotdog</a>
  </div>
