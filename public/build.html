<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هات‌داگ خودتو بساز | دکان هات‌داگ نادر</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/app.css">
<style>
  body{overscroll-behavior:none}
  .wrap{padding-top:16px}
  .stage{position:sticky;top:82px;z-index:10;background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 62%),repeating-conic-gradient(var(--surface) 0 25%,var(--bg) 0 50%) 0 0/28px 28px;border-radius:22px;padding:30px 8px 46px;touch-action:none;user-select:none;transition:box-shadow .15s}
  .stage.hot{box-shadow:inset 0 0 0 2px var(--red)}
  .stage svg{width:100%;height:auto;display:block}
  .hint{position:absolute;top:10px;inset-inline:0;text-align:center;font-weight:600;font-size:.88rem;color:var(--muted);pointer-events:none}
  .tools{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:6px}
  .tools button{border:0;background:var(--bg);border-radius:10px;padding:5px 12px;font-weight:600;font-size:.85rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tools button[disabled]{opacity:.4}
  .count{position:absolute;bottom:14px;inset-inline-end:14px;font-weight:700;font-size:.9rem}
  h2{margin:24px 0 10px;font-size:1.05rem;font-weight:800}
  h2 .muted{font-size:.85rem;font-weight:500}
  .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .tile{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:8px 4px 8px;text-align:center;font-weight:600;font-size:.8rem;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:border-color .15s}
  .tile:hover{border-color:#D9D1CB}
  .tile small{color:var(--muted);font-weight:500}
  .tile svg{width:100%;height:40px;display:block;pointer-events:none;margin-bottom:2px}
  .tile.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-50)}
  .tile .n{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;line-height:22px;font-size:.78rem;font-weight:700}
  .tile.full{opacity:.45}
  .ghost{position:fixed;z-index:80;pointer-events:none;width:110px;transform:translate(-50%,-75%) scale(1.15);filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
  .ghost svg{width:100%;height:auto}
  .finish{display:flex;gap:10px;margin-top:26px}
  .finish .btn{flex:1;font-size:1.02rem;padding:14px;min-height:52px}
  .drop{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
  @keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}
  .squeeze{stroke-dasharray:900;stroke-dashoffset:900;animation:sq .7s ease-out forwards}
  @keyframes sq{to{stroke-dashoffset:0}}
  .sum{line-height:2.1;font-size:1rem;background:var(--surface);border:0}
  .sum ol{margin-right:22px;list-style:persian}
</style>
</head>
<body>
<header class="top">
  <a class="brand" id="back" href="/menu"><img src="/img/logo.png" alt="">بازگشت به منو</a>
  <span class="chip" id="tableChip" hidden></span>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <div class="hint" id="hint">تاپینگ‌ها رو بکش روی هات‌داگ، یا روشون بزن</div>
    <svg id="dog" viewBox="0 44 400 182" aria-label="هات‌داگ شما"></svg>
    <div class="tools"><button id="undo">برگردون</button><button id="clear">پاک کن</button></div>
    <div class="count" id="count"></div>
  </div>

  <div class="row" id="buns" style="display:none"></div>
  <h2>سوسیس</h2>
  <div class="row" id="sausages"></div>
  <h2>تاپینگ</h2>
  <div class="row" id="toppings"></div>
  <h2>سس‌ها</h2>
  <div class="row" id="sauces"></div>

  <div class="finish"><button class="btn red" id="done">تموم شد</button></div>
</main>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="/cart.js"></script>
<script src="/dogart.js"></script>
<script>
(async function(){
  const fa = Cart.fa;
  document.getElementById('back').href = Cart.tableLink('/menu');
  if (Cart.table) { const c = document.getElementById('tableChip'); c.textContent = 'میز ' + fa(Cart.table); c.hidden = false; }
  const MENU = await (await fetch('/api/menu')).json();
  const C = JSON.parse(JSON.stringify(MENU.custom));
  ['buns', 'sausages', 'toppings', 'sauces'].forEach(k => C[k] = C[k].filter(x => x.available !== false));
  const priceTxt = n => n ? Cart.fa(n.toLocaleString('en-US')).replace(/,/g, '٬') + ' ' + MENU.currency : '';
  const ALL = Object.fromEntries(C.toppings.concat(C.sauces).map(t => [t.id, t]));
  const SAUCE = new Set(C.sauces.map(s => s.id));
  const priceOf = () => (C.basePrice || 0) + ((C.buns.find(b => b.id === state.bun) || {}).price || 0) + ((C.sausages.find(x => x.id === state.sausage) || {}).price || 0) + state.layers.reduce((s, l) => s + ((ALL[l.id] || {}).price || 0), 0);
  const MAX_LAYERS = 12, MAX_EACH = 2;

  const state = { bun: C.buns[0].id, sausage: C.sausages[0].id, layers: [] }; // layers: [{id, x}]
  let lastAdded = -1;

  // ================= artwork (shared with the menu pictures: /dogart.js) =================
  const D = window.DogArt, OUT = D.OUT, G = 'G';
  const colorOf = id => (ALL[id] || {}).color;
  const piece = (id, x, y, seed) => D.piece(id, x, y, seed, colorOf(id), seed !== -1);
  const defs = () => D.defs(state.bun, state.sausage, G);
  const bunBack = () => D.bunBack(state.bun, G), sausage = () => D.sausageArt(state.sausage, G), bunFront = () => D.bunFront(state.bun, G);

  // Small picture for each tray tile
  function icon(id){
    if (SAUCE.has(id)) {
      const c = colorOf(id) || '#C8102E';
      return `<svg viewBox="0 0 100 70"><rect x="36" y="14" width="28" height="48" rx="9" fill="${c}" stroke="${OUT}" stroke-width="3"/><path d="M42 14 L46 4 L54 4 L58 14" fill="#fff" stroke="${OUT}" stroke-width="3"/><rect x="41" y="30" width="18" height="16" rx="3" fill="#fff" opacity=".8"/><path d="M44 38 h12" stroke="${c}" stroke-width="3"/></svg>`;
    }
    return `<svg viewBox="138 -4 124 46">${piece(id, 200, 18, -1)}</svg>`;
  }
  function bunIcon(id){ const [a, b] = D.BUN[id] || D.BUN.plain;
    return `<svg viewBox="0 0 100 60"><path d="M10 26 Q8 54 30 54 L70 54 Q92 54 90 26 Q84 36 70 36 L30 36 Q16 36 10 26 Z" fill="${a}" stroke="${OUT}" stroke-width="3"/>${id === 'baguette' ? [28, 48, 68].map(x => `<path d="M${x-7} 50 q7 -10 14 -9" fill="none" stroke="#8E5320" stroke-width="2.5" stroke-linecap="round"/>`).join('') : ''}<path d="M12 24 Q10 12 26 12 L74 12 Q90 12 88 24 Z" fill="${b}" stroke="${OUT}" stroke-width="3"/></svg>`; }
  function sausageIcon(id){ const [a] = D.SAUSAGE[id] || D.SAUSAGE.regular;
    return `<svg viewBox="0 0 100 60"><rect x="6" y="20" width="88" height="22" rx="11" fill="${a}" stroke="${OUT}" stroke-width="3"/><rect x="14" y="23" width="70" height="5" rx="2.5" fill="#fff" opacity=".3"/>${id === 'beef' ? [30, 50, 70].map(x => `<path d="M${x} 22 l-6 18" stroke="#3E1608" stroke-width="3" opacity=".55"/>`).join('') : ''}${id === 'cheesy' ? [25, 45, 65, 82].map(x => `<ellipse cx="${x}" cy="34" rx="3.5" ry="2.5" fill="#FFC93C"/>`).join('') : ''}</svg>`; }

  // ================= render =================
  const svg = document.getElementById('dog');
  function draw(){
    let out = defs() + `<ellipse cx="200" cy="218" rx="170" ry="9" fill="#000" opacity=".15"/>` + bunBack() + sausage();
    let ti = 0, si = 0;
    state.layers.forEach((l, i) => {
      const y = SAUCE.has(l.id) ? 114 - (si++) * 6 : 93 - (ti++) * 3;
      out += `<g class="${i === lastAdded ? 'drop' : ''}" style="transform-box:fill-box">${piece(l.id, l.x, y, i * 17 + l.x)}</g>`;
    });
    out += bunFront();
    svg.innerHTML = out;
    lastAdded = -1;
    document.getElementById('undo').disabled = !state.layers.length;
    document.getElementById('clear').disabled = !state.layers.length;
    document.getElementById('count').textContent = [priceOf() ? priceTxt(priceOf()) : '', state.layers.length ? fa(state.layers.length) + ' از ' + fa(MAX_LAYERS) + ' تاپینگ' : ''].filter(Boolean).join('، ');
    document.getElementById('hint').style.display = state.layers.length ? 'none' : '';
  }
  const tile = (attrs, art, name, extra = '') => `<div class="tile ${extra}" ${attrs}>${art}<div>${name}</div></div>`;
  function renderTray(){
    document.getElementById('buns').innerHTML = C.buns.map(b => tile(`data-bun="${b.id}"`, bunIcon(b.id), b.name + (b.price ? `<br><small>+${priceTxt(b.price)}</small>` : ''), state.bun === b.id ? 'sel' : '')).join('');
    document.getElementById('sausages').innerHTML = C.sausages.map(s => tile(`data-sausage="${s.id}"`, sausageIcon(s.id), s.name + (s.price ? `<br><small>+${priceTxt(s.price)}</small>` : ''), state.sausage === s.id ? 'sel' : '')).join('');
    const n = id => state.layers.filter(l => l.id === id).length;
    const t = list => list.map(x => tile(`data-drag="${x.id}"`, icon(x.id), x.name + (x.price ? `<br><small>+${priceTxt(x.price)}</small>` : ''), n(x.id) >= MAX_EACH ? 'full' : '') .replace('</div></div>', `</div>${n(x.id) ? `<span class="n">${fa(n(x.id))}</span>` : ''}</div>`)).join('');
    document.getElementById('toppings').innerHTML = t(C.toppings);
    document.getElementById('sauces').innerHTML = t(C.sauces);
  }
  function render(){ draw(); renderTray(); }

  function addLayer(id, x){
    if (state.layers.length >= MAX_LAYERS) return Cart.toast('دیگه جا نداره!');
    if (state.layers.filter(l => l.id === id).length >= MAX_EACH) return Cart.toast('از هر کدوم حداکثر دو بار');
    x = Math.max(80, Math.min(320, Math.round(x)));
    state.layers.push({ id, x }); lastAdded = state.layers.length - 1; render();
    try { navigator.vibrate && navigator.vibrate(15); } catch(e) {}
  }

  // ================= drag & drop =================
  const stage = document.getElementById('stage');
  let drag = null;
  function svgX(clientX){
    const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = 0;
    return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  }
  const over = e => { const r = stage.getBoundingClientRect(); return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom; };
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-drag]'); if (!t) return;
    e.preventDefault(); t.setPointerCapture?.(e.pointerId);
    const ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = icon(t.dataset.drag);
    document.body.appendChild(ghost);
    drag = { id: t.dataset.drag, ghost, x0: e.clientX, y0: e.clientY, moved: false };
    move(e);
  });
  function move(e){ if (!drag) return; drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
  document.addEventListener('pointermove', e => {
    if (!drag) return; move(e);
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 10) drag.moved = true;
    stage.classList.toggle('hot', over(e));
  });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null; d.ghost.remove(); stage.classList.remove('hot');
    if (!d.moved) addLayer(d.id, 200 + (Math.random() * 80 - 40));       // tap = drop in the middle
    else if (over(e)) addLayer(d.id, svgX(e.clientX));                    // drop where released
  });
  document.addEventListener('pointercancel', () => { if (drag) { drag.ghost.remove(); drag = null; stage.classList.remove('hot'); } });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-bun]'), s = e.target.closest('[data-sausage]');
    if (b) { state.bun = b.dataset.bun; render(); }
    if (s) { state.sausage = s.dataset.sausage; render(); }
  });
  document.getElementById('undo').onclick = () => { state.layers.pop(); render(); };
  document.getElementById('clear').onclick = () => { state.layers = []; render(); };

  // ================= finish =================
  const sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
  const nm = (list, id) => list.find(x => x.id === id).name;
  document.getElementById('done').onclick = () => {
    panel.innerHTML = `<h2 style="margin-top:0">هات‌داگ شما</h2>
      <div style="background:var(--surface);border-radius:16px;padding:16px 4px 4px">${svg.outerHTML.replace('id="dog"', '')}</div>
      <div class="card sum" style="margin-top:12px"><ol>
        <li>${nm(C.buns, state.bun)}</li><li>${nm(C.sausages, state.sausage)}</li>
        ${state.layers.map(l => `<li>${ALL[l.id].name}</li>`).join('')}
      </ol>${state.layers.length ? '' : '<p class="muted">بدون تاپینگ</p>'}
      ${(() => { const p = priceOf(); return p ? `<p style="font-weight:800;font-size:1.05rem;margin-top:6px">قیمت: ${priceTxt(p)}</p>${C.note ? `<p class="muted">${C.note}</p>` : ''}` : ''; })()}</div>
      <div class="finish"><button class="btn" id="edit">ویرایش</button><button class="btn red" id="add">اضافه به سفارش</button></div>`;
    sheet.classList.add('open');
  };
  sheet.addEventListener('click', e => {
    if (e.target === sheet || e.target.id === 'edit') sheet.classList.remove('open');
    if (e.target.id === 'add') {
      Cart.addCustom({ bun: state.bun, sausage: state.sausage, layers: state.layers.map(l => l.id) });
      location.href = Cart.tableLink('/menu') + (Cart.table ? '&' : '?') + 'cart=1';
    }
  });

  render();
})();
</script>
</body>
</html>
