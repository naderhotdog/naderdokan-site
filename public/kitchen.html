<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>آشپزخانه | دکان هات‌داگ نادر</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/app.css">
<style>
  .fresh{animation:flash 1s ease 3}
  @keyframes flash{50%{background:#FFF1B8}}
  .ocard .tbl{font-size:1.7rem}
  .ocard .ln b{font-size:1.12rem}
  #print{display:none}
  @media print{
    @page{size:80mm auto;margin:3mm}
    body{background:var(--paper)}
    body > *:not(#print){display:none !important}
    #print{display:block;font-family:"Vazirmatn",sans-serif;color:#000;width:74mm;font-size:13pt;line-height:1.5}
    #print .t{font-size:22pt;font-weight:900;text-align:center;border-bottom:2px dashed #000;padding-bottom:4px;margin-bottom:6px}
    #print .m{text-align:center;font-size:10pt;margin-bottom:6px}
    #print .ln{border-bottom:1px dashed #000;padding:3px 0}
    #print ol{margin-right:20px;list-style:persian}
    #print .note{border:2px solid #000;padding:4px;margin-top:6px;font-weight:700}
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand"><img src="/img/logo.png" alt="">👨‍🍳 آشپزخانه</span>
  <span><span class="status" id="status"></span> <span id="who" style="font-size:.85rem"></span></span>
</header>
<main class="panel-wrap" id="app"></main>
<div id="print"></div>

<script src="/panel.js"></script>
<script>
(function(){
  const { fa, time, esc, api, store, beep } = Panel;
  const app = document.getElementById('app'), statusEl = document.getElementById('status');
  let autoPrint = store.get('nd_autoprint') !== '0';
  let lastSeen = parseInt(store.get('nd_last_seen') || '0', 10);
  let orders = [], queue = [], printing = false;

  const lines = o => o.lines.map(l => l.type === 'item'
    ? `<div class="ln"><b>${fa(l.qty)} × ${esc(l.name)}</b></div>`
    : `<div class="ln" style="display:block"><b>${fa(l.qty)} × 🎮 هات‌داگ سفارشی</b><ol><li>${esc(l.bun)}</li><li>${esc(l.sausage)}</li>${l.layers.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`
  ).join('') + (o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : '');

  function render(fresh = []){
    const cook = orders.filter(o => o.status === 'new').sort((a, b) => a.id - b.id);
    const ready = orders.filter(o => o.status === 'done' || o.status === 'paid').slice(0, 8);
    const card = (o, isReady) => `<div class="card ocard ${isReady ? 'paid' : ''} ${fresh.includes(o.id) ? 'fresh' : ''}">
      <div class="head"><span class="tbl">میز ${fa(o.table_no)} <small>#${fa(o.id)} · ${time(o.created)}</small></span>
      ${isReady ? `<button class="btn" data-undo="${o.id}" title="برگردون به در حال پخت">↩</button>` : `<button class="btn" data-print="${o.id}" title="چاپ">🖨️</button>`}</div>
      ${lines(o)}${isReady ? '' : `<div class="acts"><button class="btn green" data-done="${o.id}">✓ آماده شد</button></div>`}</div>`;
    app.innerHTML = `<div class="ranges"><label class="btn" style="padding:5px 14px"><input type="checkbox" id="ap" ${autoPrint ? 'checked' : ''}> چاپ خودکار</label>
        <button class="btn" id="test" style="padding:5px 14px">🔔 تست صدا</button><b>${fa(cook.length)} سفارش در حال پخت</b></div>
      <h2>🔥 در حال پخت</h2>${cook.length ? `<div class="grid-orders">${cook.map(o => card(o, false)).join('')}</div>` : '<p class="empty">فعلاً سفارشی نیست 😴</p>'}
      ${ready.length ? `<h2>✅ آماده‌شده</h2><div class="grid-orders">${ready.map(o => card(o, true)).join('')}</div>` : ''}`;
  }

  async function poll(){
    try {
      orders = await api('/api/orders');
      statusEl.textContent = '🟢';
      const fresh = orders.filter(o => o.id > lastSeen && o.status === 'new').sort((a, b) => a.id - b.id);
      if (fresh.length) {
        lastSeen = Math.max(...orders.map(o => o.id)); store.set('nd_last_seen', String(lastSeen));
        beep(); if (autoPrint) queue.push(...fresh);
        render(fresh.map(o => o.id)); runPrint();
      } else render();
    } catch(e) { statusEl.textContent = '🔴 قطع اتصال'; }
  }

  app.addEventListener('click', async e => {
    const b = e.target.closest('button, input'); if (!b) return;
    if (b.id === 'ap') { autoPrint = b.checked; store.set('nd_autoprint', autoPrint ? '1' : '0'); return; }
    if (b.id === 'test') return beep();
    if (b.dataset.print) { queue.push(orders.find(o => o.id == b.dataset.print)); return runPrint(); }
    const id = b.dataset.done || b.dataset.undo;
    if (id) { b.disabled = true; await api(`/api/orders/${id}/status`, { method: 'POST', body: JSON.stringify({ status: b.dataset.done ? 'done' : 'new' }) }); poll(); }
  });

  function runPrint(){
    if (printing || !queue.length) return;
    printing = true; const o = queue.shift();
    document.getElementById('print').innerHTML = `<div class="m">دکان هات‌داگ نادر</div><div class="t">میز ${fa(o.table_no)}</div><div class="m">سفارش #${fa(o.id)} · ${time(o.created)}</div>${lines(o)}`;
    setTimeout(() => { window.print(); printing = false; setTimeout(runPrint, 500); }, 150);
  }

  Panel.start('kitchen', async () => {
    orders = await api('/api/orders');
    if (!lastSeen) { lastSeen = orders.reduce((m, o) => Math.max(m, o.id), 0); store.set('nd_last_seen', String(lastSeen)); }
    render(); setInterval(poll, 4000);
  });
})();
</script>
</body>
</html>
