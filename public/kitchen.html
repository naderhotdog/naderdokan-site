<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>آشپزخانه | دکان نادر</title>
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .wrap{max-width:1200px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .order{position:relative}
  .order.fresh{animation:flash 1s ease 3}
  @keyframes flash{50%{background:#FFF1B8}}
  .order .head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
  .tbl{font-size:1.6rem;font-weight:900}
  .tbl small{font-size:.9rem;font-weight:600;color:var(--muted)}
  .ln{padding:6px 0;border-bottom:1px dashed rgba(29,20,16,.2)}
  .ln b{font-size:1.1rem}
  .ln ol{margin:4px 22px 0 0;font-size:.98rem;list-style:persian}
  .note{background:#FFF1B8;border-radius:8px;padding:6px 10px;margin-top:8px;font-weight:700}
  .done{opacity:.55}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .login{max-width:380px;margin:60px auto;text-align:center}
  .login input{width:100%;font:inherit;font-size:1.2rem;text-align:center;border:2px solid var(--ink);border-radius:12px;padding:10px;margin:14px 0}
  .status{font-weight:700}
  #print{display:none}
  @media print{
    @page{size:80mm auto;margin:3mm}
    body{background:#fff}
    body > *:not(#print){display:none !important}
    #print{display:block;font-family:"Vazirmatn",sans-serif;color:#000;width:74mm;font-size:13pt;line-height:1.5}
    #print .t{font-size:22pt;font-weight:900;text-align:center;border-bottom:2px dashed #000;padding-bottom:4px;margin-bottom:6px}
    #print .m{text-align:center;font-size:10pt;margin-bottom:6px}
    #print .ln{border-bottom:1px dashed #000}
    #print .note{background:none;border:2px solid #000}
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand"><img src="/img/logo.jpg" alt="">آشپزخانه‌ی دکان نادر</span>
  <span class="status" id="status"></span>
</header>
<main class="wrap" id="app"></main>
<div id="print"></div>

<script>
(function(){
  const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const mem = {};
  const st = { get: k => { try { return localStorage.getItem(k); } catch(e) { return mem[k] ?? null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) { mem[k] = v; } } };
  const app = document.getElementById('app'), statusEl = document.getElementById('status');
  let key = st.get('nd_kitchen_key');
  let autoPrint = st.get('nd_autoprint') !== '0';
  let lastSeen = parseInt(st.get('nd_last_seen') || '0', 10);
  let started = false, orders = [], printQueue = [], printing = false, audio;

  function beep(){
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, .18, .36].forEach(t => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.3, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .15);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .16);
      });
    } catch(e) {}
  }
  const time = ms => fa(new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
  function linesHTML(o){
    return o.lines.map(l => l.type === 'item'
      ? `<div class="ln"><b>${fa(l.qty)} × ${l.name}</b></div>`
      : `<div class="ln"><b>${fa(l.qty)} × 🎮 هات‌داگ سفارشی</b><ol><li>${l.bun}</li><li>${l.sausage}</li>${l.layers.map(x => `<li>${x}</li>`).join('')}</ol></div>`
    ).join('') + (o.note ? `<div class="note">📝 ${o.note.replace(/[<>&]/g, '')}</div>` : '');
  }

  async function showSetup(msg){
    app.innerHTML = `<div class="card login"><h2 style="margin-top:0">راه‌اندازی آشپزخانه</h2>
      <p class="muted">یک کد برای ورود به این صفحه انتخاب کنید (حداقل ۴ کاراکتر). این کد رو فقط به آشپزها بدید.</p>${msg ? `<p style="color:var(--ketchup);font-weight:700">${msg}</p>` : ''}
      <input id="k1" type="password" autocomplete="new-password" placeholder="کد جدید"><input id="k2" type="password" autocomplete="new-password" placeholder="تکرار کد" style="margin-top:0">
      <button class="btn red" id="save" style="width:100%">ذخیره و ورود</button></div>`;
    document.getElementById('save').onclick = async () => {
      const a = document.getElementById('k1').value.trim(), b = document.getElementById('k2').value.trim();
      if (a.length < 4) return showSetup('کد باید حداقل ۴ کاراکتر باشه');
      if (a !== b) return showSetup('دو کد یکی نیستن');
      const r = await fetch('/api/kitchen/setup', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({ key: a }) });
      if (!r.ok) return showLogin('کد قبلاً تنظیم شده؛ وارد شوید');
      key = a; start();
    };
  }

  function showLogin(msg){
    app.innerHTML = `<div class="card login"><h2 style="margin-top:0">ورود آشپزخانه</h2>
      <p class="muted">کد آشپزخانه رو وارد کنید</p>${msg ? `<p style="color:var(--ketchup);font-weight:700">${msg}</p>` : ''}
      <input id="k" type="password" autocomplete="current-password"><button class="btn red" id="go" style="width:100%">ورود</button></div>`;
    document.getElementById('go').onclick = () => { key = document.getElementById('k').value.trim(); start(); };
  }

  async function api(path, opts = {}){
    const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-kitchen-key': key, ...(opts.headers || {}) } });
    if (r.status === 401) throw new Error('auth');
    return r.json();
  }

  async function start(){
    try { orders = await api('/api/orders'); }
    catch(e) { if (e.message === 'auth') { st.set('nd_kitchen_key', ''); return showLogin(key ? 'کد اشتباهه' : ''); } }
    st.set('nd_kitchen_key', key);
    if (!lastSeen) { lastSeen = orders.reduce((m, o) => Math.max(m, o.id), 0); st.set('nd_last_seen', String(lastSeen)); }
    started = true;
    render(); setInterval(poll, 4000); poll();
  }

  async function poll(){
    try {
      orders = await api('/api/orders');
      statusEl.textContent = '🟢 آنلاین';
      const fresh = orders.filter(o => o.id > lastSeen).sort((a, b) => a.id - b.id);
      if (fresh.length) {
        lastSeen = fresh[fresh.length - 1].id; st.set('nd_last_seen', String(lastSeen));
        beep();
        if (autoPrint) fresh.forEach(o => printQueue.push(o));
        render(fresh.map(o => o.id)); runPrint();
      } else render();
    } catch(e) { statusEl.textContent = '🔴 قطع اتصال'; }
  }

  function render(freshIds = []){
    if (!started) return;
    const active = orders.filter(o => o.status === 'new'), done = orders.filter(o => o.status === 'done').slice(0, 12);
    const card = (o, isDone) => `<div class="card order ${isDone ? 'done' : ''} ${freshIds.includes(o.id) ? 'fresh' : ''}">
      <div class="head"><span class="tbl">میز ${fa(o.table_no)} <small>#${fa(o.id)} · ${time(o.created)}</small></span>
      <span>${isDone ? `<button class="btn" data-undo="${o.id}">↩</button>` : `<button class="btn" data-print="${o.id}">🖨️</button>`}</span></div>
      ${linesHTML(o)}${isDone ? '' : `<button class="btn green" style="width:100%;margin-top:12px" data-done="${o.id}">✓ آماده شد</button>`}</div>`;
    app.innerHTML = `<div class="controls"><label class="btn"><input type="checkbox" id="ap" ${autoPrint ? 'checked' : ''}> چاپ خودکار</label>
        <button class="btn" id="test">🔔 تست صدا</button><span class="muted">${fa(active.length)} سفارش در انتظار</span></div>
      <h2>در انتظار</h2>${active.length ? `<div class="grid">${active.slice().reverse().map(o => card(o, false)).join('')}</div>` : '<p class="muted">فعلاً سفارشی نیست 😴</p>'}
      ${done.length ? `<h2>آماده‌شده</h2><div class="grid">${done.map(o => card(o, true)).join('')}</div>` : ''}`;
  }

  app.addEventListener('click', async e => {
    const b = e.target.closest('button, input'); if (!b) return;
    if (b.id === 'ap') { autoPrint = b.checked; st.set('nd_autoprint', autoPrint ? '1' : '0'); return; }
    if (b.id === 'test') { beep(); return; }
    if (b.dataset.print) { printQueue.push(orders.find(o => o.id == b.dataset.print)); runPrint(); return; }
    const id = b.dataset.done || b.dataset.undo;
    if (id) { b.disabled = true; await api(`/api/orders/${id}/status`, { method: 'POST', body: JSON.stringify({ status: b.dataset.done ? 'done' : 'new' }) }); poll(); }
  });

  function runPrint(){
    if (printing || !printQueue.length) return;
    printing = true;
    const o = printQueue.shift();
    document.getElementById('print').innerHTML = `<div class="m">دکان هات‌داگ نادر</div><div class="t">میز ${fa(o.table_no)}</div><div class="m">سفارش #${fa(o.id)} · ${time(o.created)}</div>${linesHTML(o)}`;
    setTimeout(() => { window.print(); printing = false; setTimeout(runPrint, 500); }, 150);
  }

  (async () => {
    if (key) return start();
    try { const s = await (await fetch('/api/kitchen/setup')).json(); s.configured ? showLogin() : showSetup(); }
    catch(e) { showLogin(); }
  })();
})();
</script>
</body>
</html>
