<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منو و سفارش | دکان نادر</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/app.css">
<style>
  .hero-build{display:flex;align-items:center;gap:14px;background:var(--surface);border:0;text-decoration:none;margin-top:4px;padding:14px 16px}
  .hero-build .big{width:52px;height:52px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:1.6rem}
  .hero-build b{font-weight:800;font-size:1.05rem;display:block;line-height:1.5}
  .hero-build span:last-child{color:var(--muted);font-size:.9rem}
  .hero-build::after{content:"";width:9px;height:9px;border-top:2px solid var(--muted);border-left:2px solid var(--muted);transform:rotate(-45deg);margin-inline-start:auto;flex:none}
  .catnav{position:sticky;top:74px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:12px 16px 10px;margin:0 -16px;background:rgba(248,239,220,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none;border-bottom:1px solid var(--line)}
  .catnav::-webkit-scrollbar{display:none}
  .catnav a{flex:none;text-decoration:none;border-radius:999px;padding:6px 16px;font-weight:600;background:var(--surface);color:var(--ink-2);font-size:.9rem}
  .catnav a.on{background:var(--ink);color:#fff}
  .items{display:grid;gap:0}
  .item{display:grid;grid-template-columns:1fr 104px;gap:14px;align-items:center;border:0;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0}
  .item .order,.item .order-q{grid-column:1/-1;order:3}
  .item .btn.order{width:100%;min-height:46px;font-size:1rem}
  .item .btn.order[aria-disabled]{opacity:.55;pointer-events:none}
  .order-q{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:4px;min-height:46px}
  .order-q span{font-weight:700}
  .order-q button{width:38px;height:38px;border-radius:10px;border:0;background:var(--red);color:#fff;font-size:1.3rem;font-weight:700;line-height:1}
  .item .pic{order:2;background:var(--surface);border-radius:14px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .item .pic svg{width:135%;max-width:none;transform:rotate(-24deg)}
  .item .pic.em{font-size:2.8rem}
  .item .info{min-width:0}
  .item h3{font-weight:800;font-size:1.05rem;line-height:1.5}
  .item p{font-size:.85rem;line-height:1.75;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .item .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
  .item .price{font-weight:700}
  .item.off{opacity:.5}
  @media (max-width:420px){.item{grid-template-columns:1fr 88px}}
  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:18px}
  .tables .btn{font-size:1.5rem;font-weight:800;padding:22px 0;border-radius:16px}
  .alt{display:grid;gap:10px;margin-top:26px}
  .note{background:var(--surface);border-radius:14px;padding:12px 16px;margin-top:4px;font-size:.92rem;color:var(--ink-2)}
  .line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .line .info{flex:1}
  .line small{display:block;color:var(--muted)}
  .done-box{text-align:center;padding:36px 16px;border:0;background:var(--surface)}
  .done-box .big{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .num{font-size:3rem;font-weight:900;color:var(--red);line-height:1.3}
  h2{scroll-margin-top:140px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/img/logo.png" alt="">دکان هات‌داگ نادر</a>
  
</header>

<main class="wrap" id="app"><p class="muted" style="text-align:center;margin-top:40px">در حال بارگذاری منو…</p></main>

<div class="bar" id="bar" hidden>
  <span id="barText"></span>
  <button class="btn yellow" id="openCart">مشاهده سفارش</button>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="/cart.js"></script>
<script src="/dogart.js"></script>
<script>
(async function(){
  const app = document.getElementById('app');
  const fa = Cart.fa;
  let MENU;
  try { MENU = await (await fetch('/api/menu')).json(); }
  catch(e){ app.innerHTML = '<p style="text-align:center;margin-top:40px">اتصال برقرار نشد. لطفاً دوباره امتحان کنید.</p>'; return; }

  const SNAPP = 'https://snappfood.ir/restaurant/menu/%D9%87%D8%A7%D8%AA_%D8%AF%D8%A7%DA%AF_%D9%86%D8%A7%D8%AF%D8%B1-r-xdw1n2/';
  const money = (p) => p == null ? 'قیمت در صندوق' : fa(p.toLocaleString('en-US')).replace(/,/g,'٬') + ' ' + MENU.currency;
  const C0 = MENU.custom, EXTRA0 = Object.fromEntries(C0.toppings.concat(C0.sauces).map(t => [t.id, t]));
  const pick = (list, id) => list.find(x => x.id === id);
  const customOk = l => pick(C0.buns, l.bun) && pick(C0.sausages, l.sausage) && (l.layers || []).every(id => EXTRA0[id]);
  const customPrice = l => (C0.basePrice || 0) + ((pick(C0.buns, l.bun) || {}).price || 0) + ((pick(C0.sausages, l.sausage) || {}).price || 0) + l.layers.reduce((s, id) => s + ((EXTRA0[id] || {}).price || 0), 0);
  const unitPrice = l => l.type === 'item' ? ((MENU.items.find(i => i.id === l.id) || {}).price || 0) : customPrice(l);
  const cartTotal = () => Cart.items().reduce((s, l) => s + unitPrice(l) * l.qty, 0);
  // Drop things from the saved cart that are no longer on the menu or sold out.
  { const okItem = id => { const i = MENU.items.find(x => x.id === id); return i && i.available !== false; };
    const c = Cart.items(), keep = c.filter(l => l.type === 'item' ? okItem(l.id) : customOk(l));
    if (keep.length !== c.length) { Cart.clear(); keep.forEach(l => l.type === 'item' ? Cart.addItem(l.id, l.qty) : Cart.addCustom(l)); } }

  const cats = (MENU.cats && MENU.cats.length ? MENU.cats : [{ id: 'hotdog', name: 'هات‌داگ‌ها', short: 'هات‌داگ', emoji: '🌭' }, { id: 'food', name: 'خوراکی‌ها', short: 'خوراکی', emoji: '🍟' }, { id: 'drink', name: 'نوشیدنی‌ها', short: 'نوشیدنی', emoji: '🥤' }])
    .filter(c => MENU.items.some(i => i.cat === c.id));
  const isDog = i => /^(special|classic|hotdog)$/.test(i.cat) || DogArt.LOOKS[i.id];
  const view = false; // ordering is open to everyone now (no table numbers)
  const foot = `<footer class="site-foot"><div class="en">دکان هات‌داگ نادر</div>
      <p>شنبه تا پنجشنبه ۱۴:۰۰ تا ۲۳:۴۵، جمعه ۱۵:۰۰ تا ۲۳:۴۵</p>
      <p>قم، زنبیل‌آباد، ۳۰متری قائم، بین کوچه ۵ و ۷، پلاک ۱۹۹</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"><a class="btn" href="tel:02532903005" dir="ltr">025-3290-3005</a><a class="btn" href="https://instagram.com/naderhotdog" target="_blank" rel="noopener" dir="ltr">@naderhotdog</a><a class="btn snapp" href="${SNAPP}" target="_blank" rel="noopener">اسنپ‌فود</a></div></footer>`;

  const pic = i => isDog(i) ? `<div class="pic">${DogArt.svg(DogArt.look(i.id))}</div>` : `<div class="pic em">${i.emoji || '🍽️'}</div>`;
  function render(){
    app.innerHTML =
      (view ? `<div class="note">این منوی ماست. برای سفارش سر میز، کد QR روی میز رو اسکن کنید؛ برای سفارش با پیک: <a href="${SNAPP}" target="_blank" rel="noopener"><b>اسنپ‌فود</b></a></div>`
            : `<a class="card hero-build" href="${Cart.tableLink('/build')}"><span class="big">+</span><span><b>هات‌داگ خودتو بساز!</b>سوسیس، تاپینگ و سس رو خودت انتخاب کن</span></a>`) +
      `<nav class="catnav">${cats.map((c, k) => `<a href="#c-${c.id}" class="${k ? '' : 'on'}">${c.short || c.name}</a>`).join('')}</nav>` +
      cats.map(c => {
        const list = MENU.items.filter(i => i.cat === c.id);
        return `<h2 id="c-${c.id}">${c.name}</h2><div class="items">` + list.map(i => {
          const q = Cart.qtyOf(i.id), off = i.available === false;
          const ctl = off ? '<span class="btn order" aria-disabled="true">فعلاً تموم شده</span>'
            : q ? `<div class="order-q"><button data-add="${i.id}" data-d="-1" aria-label="کم کردن">−</button><span>${fa(q)} عدد در سفارش</span><button data-add="${i.id}" data-d="1" aria-label="اضافه کردن">+</button></div>`
            : `<button class="btn red order" data-add="${i.id}" data-d="1">سفارش</button>`;
          return `<div class="card item ${off ? 'off' : ''}">${pic(i)}<div class="info"><h3>${i.name}</h3>${i.desc ? `<p class="muted">${i.desc}</p>` : ''}
            <div class="foot"><span class="price">${off ? '' : money(i.price)}</span></div></div>${ctl}</div>`;
        }).join('') + '</div>';
      }).join('') + foot;
    updateBar();
    const links = [...app.querySelectorAll('.catnav a')];
    const spy = () => { let cur = links[0]; links.forEach(a => { const h = document.querySelector(a.getAttribute('href')); if (h && h.getBoundingClientRect().top < 160) cur = a; }); links.forEach(a => a.classList.toggle('on', a === cur)); };
    window.onscroll = spy;
  }
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    Cart.addItem(b.dataset.add, +b.dataset.d); render();
  });

  const bar = document.getElementById('bar');
  function updateBar(){
    const n = Cart.count();
    bar.hidden = n === 0 || view;
    const t = cartTotal();
    document.getElementById('barText').textContent = fa(n) + ' مورد' + (t ? '، ' + money(t) : ' در سفارش');
  }

  const sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
  const nameOf = id => (MENU.items.find(i => i.id === id) || {}).name || id;
  const findName = (list, id) => (list.find(x => x.id === id) || {}).name || id;
  function renderCart(){
    const lines = Cart.items();
    if (!lines.length) { sheet.classList.remove('open'); render(); return; }
    panel.innerHTML = '<h2 style="margin-top:0">سفارش شما</h2>' +
      lines.map((l, i) => {
        let title, sub = '';
        if (l.type === 'item') title = nameOf(l.id);
        else {
          title = 'هات‌داگ سفارشی';
          const C = MENU.custom;
          sub = [findName(C.buns, l.bun), findName(C.sausages, l.sausage)]
            .concat(l.layers.map(id => findName(C.toppings.concat(C.sauces), id))).join('، ');
        }
        return `<div class="line"><div class="info"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>
          <div class="qty"><button data-i="${i}" data-q="${l.qty-1}">−</button><span>${fa(l.qty)}</span><button data-i="${i}" data-q="${l.qty+1}">+</button></div></div>`;
      }).join('') +
      `<h2>توضیحات (اختیاری)</h2><textarea id="note" rows="2" maxlength="200" placeholder="مثلاً: بدون پیاز، سس جدا"></textarea>
       ${cartTotal() ? `<div class="line" style="font-size:1.1rem"><b class="info">جمع</b><b>${money(cartTotal())}</b></div>` : ''}
       <p class="muted" style="margin:12px 0">پرداخت در صندوق انجام میشه.</p>
       <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" id="send" style="flex:1">ثبت سفارش</button><button class="btn" id="close">ادامه‌ی انتخاب</button></div>`;
  }
  document.getElementById('openCart').onclick = () => { renderCart(); sheet.classList.add('open'); };
  sheet.addEventListener('click', async e => {
    if (e.target === sheet || e.target.id === 'close') { sheet.classList.remove('open'); render(); return; }
    const q = e.target.closest('[data-i]');
    if (q) { Cart.setQtyAt(+q.dataset.i, Math.min(20, +q.dataset.q)); renderCart(); return; }
    if (e.target.id === 'send') {
      const btn = e.target; btn.disabled = true; btn.textContent = 'در حال ارسال…';
      try {
        const r = await fetch('/api/order', { method: 'POST', headers: {'content-type': 'application/json'},
          body: JSON.stringify({ table: Cart.table, lines: Cart.items(), note: document.getElementById('note').value }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        Cart.clear(); sheet.classList.remove('open'); bar.hidden = true;
        showDone(d.id);
      } catch(err) {
        btn.disabled = false; btn.textContent = 'ثبت سفارش';
        Cart.toast(String(err.message) === 'lines' ? 'یکی از موارد سفارش تموم شده؛ لطفاً سفارش رو بررسی کنید' : 'ارسال نشد، دوباره امتحان کنید');
      }
    }
  });

  function showDone(id){
    app.innerHTML = `<div class="card done-box"><div class="big">✓</div><h2>سفارش‌تون به آشپزخونه رسید!</h2>
      <p>شماره‌ی سفارش</p><div class="num">${fa(id)}</div>
      <p id="st" class="muted" style="margin-top:10px">در حال آماده‌سازی…</p>
      <p class="muted" style="margin-top:6px">لطفاً در صندوق پرداخت کنید.</p>
      <a class="btn yellow" style="margin-top:18px" href="${Cart.tableLink('/menu')}">سفارش جدید</a></div>`;
    const poll = setInterval(async () => {
      try {
        const s = await (await fetch('/api/order/' + id)).json();
        if (s.status === 'done') { document.getElementById('st').innerHTML = '<b style="color:var(--green)">سفارش‌تون آماده‌ست!</b>'; clearInterval(poll); }
      } catch(e) {}
    }, 6000);
  }

  render();
  if (new URLSearchParams(location.search).get('cart') === '1') document.getElementById('openCart').click();
})();
</script>
</body>
</html>
